spring.application.name=clinia-api
server.port=${PORT:${SERVER_PORT:8080}}
server.address=${SERVER_ADDRESS:0.0.0.0}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/clinia}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Asuncion
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=${SHOW_SQL:false}

spring.jackson.time-zone=America/Asuncion
spring.jackson.serialization.write-dates-as-timestamps=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

clinia.owner-commission-percentage=${OWNER_COMMISSION_PERCENTAGE:40}
clinia.timezone=America/Asuncion
clinia.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
